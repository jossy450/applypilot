# Pushing a tag like v1.2.0 runs the tests, then publishes a GitHub release
# with the extension zipped and ready for "Load unpacked" or the Web Store.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
      - name: Package the extension
        run: zip -r "applypilot-$GITHUB_REF_NAME.zip" manifest.json src popup options icons
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "applypilot-$GITHUB_REF_NAME.zip" --title "ApplyPilot $GITHUB_REF_NAME" --generate-notes
